version: "3.8"

services:
  nginx_static:
    image: nginx
    restart: unless-stopped
    container_name: nginx_static
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
      - "${DOCKER_STATIC_HOSTING}:/var/www/static"
    ports:
      - "${PORT}:80"
    networks:
      - https

networks:
  https:
    name: ${HTTPS_NETWORK}
    external: true
